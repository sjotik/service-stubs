# Заголовки, которые Home Assistant добавляет на ответы (снято с эталона 2026.9.x).
# Server эталон отдаёт ПУСТЫМ; nginx шлёт "Server: nginx" — точный пустой/aiohttp требует
# модуля headers-more (см. README).
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# =====================================================================
#  Тело server-блока home-assistant-заглушки: root и все location.
#  Поведение снято со снимка эталонного Home Assistant 2026.9.4 (Docker).
#  Эмулируется ОНБОРДЕННЫЙ инстанс. Плейсхолдер HASTUB_ROOT подставляет install.sh.
# =====================================================================
server_tokens off;
root HASTUB_ROOT;
absolute_redirect off;

gzip on;
gzip_types text/css text/javascript application/json image/svg+xml application/manifest+json;
gzip_min_length 256;

types {
    text/html                 html htm;
    text/javascript           js mjs;
    text/css                  css;
    application/json          json;
    application/wasm          wasm;
    image/svg+xml             svg svgz;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/webp                webp;
    image/vnd.microsoft.icon  ico;
    font/woff                 woff;
    font/woff2                woff2;
    font/ttf                  ttf;
    text/plain                txt map;
    application/xml           xml;
}
default_type application/octet-stream;

# тела ошибок как у эталона: 404 -> text/plain «404: Not Found»; 405 -> пусто.
error_page 404 =404 /_ha_404;
error_page 405 =405 /_ha_empty;
location = /_ha_404   { internal; include snippets/hastub_hdr_common.conf; default_type "text/plain; charset=utf-8"; alias HASTUB_ROOT/_svc/notfound; }
location = /_ha_empty { internal; include snippets/hastub_hdr_common.conf; alias HASTUB_ROOT/_svc/empty; }

# служебные тела наружу напрямую не отдаём
location ^~ /_svc/ { internal; }

# ---------- корень: онбордён -> отдаёт приложение (index.html) ----------
location = / {
    include snippets/hastub_hdr_common.conf;
    types { }                      # очистить .html -> text/html, чтобы сработал default_type с charset
    default_type "text/html; charset=utf-8";
    try_files /index.html =404;
}

# ---------- manifest (application/manifest+json; charset=utf-8) ----------
location = /manifest.json {
    include snippets/hastub_hdr_common.conf;
    types { }                      # очистить маппинг .json -> application/json, чтобы default_type сработал
    default_type "application/manifest+json; charset=utf-8";
    return 200 '{"background_color":"#FFFFFF","description":"Home automation platform that puts local control and privacy first.","dir":"ltr","display":"standalone","icons":[{"purpose":"any","sizes":"192x192","src":"/static/icons/favicon-192x192.png","type":"image/png"},{"purpose":"any","sizes":"384x384","src":"/static/icons/favicon-384x384.png","type":"image/png"},{"purpose":"any","sizes":"512x512","src":"/static/icons/favicon-512x512.png","type":"image/png"},{"purpose":"any","sizes":"1024x1024","src":"/static/icons/favicon-1024x1024.png","type":"image/png"},{"purpose":"maskable","sizes":"48x48","src":"/static/icons/maskable_icon-48x48.png","type":"image/png"},{"purpose":"maskable","sizes":"72x72","src":"/static/icons/maskable_icon-72x72.png","type":"image/png"},{"purpose":"maskable","sizes":"96x96","src":"/static/icons/maskable_icon-96x96.png","type":"image/png"},{"purpose":"maskable","sizes":"128x128","src":"/static/icons/maskable_icon-128x128.png","type":"image/png"},{"purpose":"maskable","sizes":"192x192","src":"/static/icons/maskable_icon-192x192.png","type":"image/png"},{"purpose":"maskable","sizes":"384x384","src":"/static/icons/maskable_icon-384x384.png","type":"image/png"},{"purpose":"maskable","sizes":"512x512","src":"/static/icons/maskable_icon-512x512.png","type":"image/png"}],"id":"/?homescreen=1","lang":"en-US","name":"Home Assistant","prefer_related_applications":true,"related_applications":[{"id":"io.homeassistant.companion.android","platform":"play"}],"screenshots":[{"sizes":"413x792","src":"/static/images/screenshots/screenshot-1.png","type":"image/png"}],"short_name":"Home Assistant","start_url":"/?homescreen=1","theme_color":"#2980b9"}';
}

# ---------- auth ----------
location = /auth/providers {
    include snippets/hastub_hdr_common.conf;
    default_type "application/json";     # у эталона здесь БЕЗ charset
    return 200 '{"providers":[{"name":"Home Assistant Local","id":null,"type":"homeassistant"}],"preselect_remember_me":true}';
}
location = /auth/authorize {
    include snippets/hastub_hdr_common.conf;
    default_type "text/html";          # у эталона здесь БЕЗ charset
    alias HASTUB_ROOT/authorize.html;
}
# создание flow: GET -> 405; POST -> форма (flow_id из $request_id, 32 hex)
location = /auth/login_flow {
    include snippets/hastub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    if ($request_method = GET) { return 405; }
    return 200 '{"type":"form","flow_id":"$request_id","handler":["homeassistant",null],"data_schema":[{"type":"string","name":"username","required":true},{"type":"string","name":"password","required":true}],"errors":{},"description_placeholders":null,"last_step":null,"preview":null,"step_id":"init"}';
}
# шаг flow: любой ввод -> форма с errors.base=invalid_auth; flow_id эхом из URL. Данные не читаются.
location ~ ^/auth/login_flow/(?<fid>[A-Za-z0-9_-]+)$ {
    include snippets/hastub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 200 '{"type":"form","flow_id":"$fid","handler":["homeassistant",null],"data_schema":[{"type":"string","name":"username","required":true},{"type":"string","name":"password","required":true}],"errors":{"base":"invalid_auth"},"description_placeholders":null,"last_step":null,"preview":null,"step_id":"init"}';
}

# ---------- /api/* без токена -> 401 (как эталон) ----------
location ^~ /api/ {
    include snippets/hastub_hdr_common.conf;
    default_type "text/plain; charset=utf-8";
    return 401 "401: Unauthorized";
}
# bare /api у эталона -> 404 (падает в catch-all), поэтому отдельной 401-локации нет.

# ---------- статика ----------
location ^~ /frontend_latest/ {
    include snippets/hastub_hdr_common.conf;
    add_header Cache-Control "public, max-age=2678400" always;
    try_files $uri =404;
}
location ^~ /static/ {
    include snippets/hastub_hdr_common.conf;
    add_header Cache-Control "public, max-age=2678400" always;
    try_files $uri =404;
}
# /favicon.ico у эталона -> 404 (favicon только в /static/icons/) — спец-локации нет, падает в catch-all

# robots.txt отдельно: text/plain БЕЗ charset (у эталона так; иначе catch-all добавит charset)
location = /robots.txt {
    include snippets/hastub_hdr_common.conf;
    try_files /robots.txt =404;
}

# прочая статика в корне www (sw-*.js, service_worker.js, robots.txt, index.html) +
# сюда приходит internal redirect от "/" -> index.html получает charset=utf-8.
location / {
    include snippets/hastub_hdr_common.conf;
    charset utf-8;                 # charset только на text/html (дефолтный charset_types); js/css — без
    try_files $uri =404;
}

# =====================================================================
#  Home Assistant-заглушка (статическая имитация). nginx + статика, без бэкенда.
#  Поведение снято со снимка эталонного Home Assistant 2026.9.4 (локальный Docker).
#  Плейсхолдеры HASTUB_DOMAIN / HASTUB_SSL_* (+ HASTUB_ROOT в сниппете)
#  подставляет install.sh. Вся логика — в snippets/hastub_locations.conf.
# =====================================================================

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name HASTUB_DOMAIN;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS — сама заглушка
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name HASTUB_DOMAIN;

    ssl_certificate     HASTUB_SSL_CERT;
    ssl_certificate_key HASTUB_SSL_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/hastub_locations.conf;
}

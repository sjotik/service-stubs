# Заголовки и cookie, которые реальный Nextcloud добавляет к «динамическим» (PHP) ответам.
# Общие заголовки повторяем здесь же: add_header не наследуется в location, где есть свои add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Powered-By "PHP/8.3.33" always;
add_header Cache-Control "no-cache, no-store, must-revalidate" always;
add_header X-Request-Id "$request_id" always;
add_header Set-Cookie "NCSTUB_SESSNAME=$request_id; path=/; secure; HttpOnly; SameSite=Lax" always;
add_header Set-Cookie "oc_sessionPassphrase=$request_id$connection$msec; path=/; secure; HttpOnly; SameSite=Lax" always;
add_header Set-Cookie "__Host-nc_sameSiteCookielax=true; path=/; httponly;secure; expires=Fri, 31-Dec-2100 23:59:59 GMT; SameSite=lax" always;
add_header Set-Cookie "__Host-nc_sameSiteCookiestrict=true; path=/; httponly;secure; expires=Fri, 31-Dec-2100 23:59:59 GMT; SameSite=strict" always;

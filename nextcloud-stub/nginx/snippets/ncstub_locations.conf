# =====================================================================
#  Тело server-блока заглушки: root, gzip и все location.
#  Подключается из nextcloud-stub.conf (и из HTTP-варианта для локальных
#  проверок). Редиректы относительные — сохраняют схему, хост и порт.
# =====================================================================
server_tokens off;
root NCSTUB_ROOT;
absolute_redirect off;      # держим Location относительными -> порт/схема сохраняются

gzip on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
gzip_min_length 256;

# внутренние деревья наружу не отдаём (/_tpl обрабатывает regex-локация — она internal)
location ^~ /_svc/ { internal; }
location ^~ /_r/   { internal; }

# ---------- внутренние «ответчики» для НЕ-200 ответов с телом из файла ----------
location = /_r/dav401 {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_nostatic.conf;
    add_header WWW-Authenticate "Basic realm=\"Nextcloud\", charset=\"UTF-8\"" always;
    add_header Content-Security-Policy "default-src 'none';" always;
    default_type "application/xml; charset=utf-8";
    alias NCSTUB_ROOT/_svc/dav_propfind_401.xml;
}
location = /_r/caps_xml {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    include snippets/ncstub_nostatic.conf;
    default_type "application/xml; charset=utf-8";
    alias NCSTUB_ROOT/_svc/capabilities.xml;
}
location = /_r/caps_json {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    include snippets/ncstub_nostatic.conf;
    default_type "application/json; charset=utf-8";
    alias NCSTUB_ROOT/_svc/capabilities.json;
}
location = /_r/caps_v1_xml {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    include snippets/ncstub_nostatic.conf;
    default_type "application/xml; charset=utf-8";
    alias NCSTUB_ROOT/_svc/capabilities_v1.xml;
}
location = /_r/caps_v1_json {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    include snippets/ncstub_nostatic.conf;
    default_type "application/json; charset=utf-8";
    alias NCSTUB_ROOT/_svc/capabilities_v1.json;
}
location = /_r/404 {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_page.conf;
    default_type "text/html; charset=UTF-8";
    sub_filter_once off; sub_filter "NCSTUB_NONCE" "$request_id";
    try_files /_svc/404.html =404;
}
location ~ ^/_tpl/.+\.html$ {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_page.conf;
    add_header Feature-Policy "autoplay 'self';camera 'none';fullscreen 'self';geolocation 'none';microphone 'none';payment 'none'" always;
    default_type "text/html; charset=UTF-8";
    sub_filter_once off; sub_filter "NCSTUB_NONCE" "$request_id";
}

# ---------- корень / вход ----------
location = / {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_loose.conf;
    return 302 /login;
}
location = /index.php { include snippets/ncstub_hdr_php.conf; return 302 /login; }

location = /login {
    include snippets/ncstub_hdr_php.conf;
    if ($request_method = POST) { rewrite ^ /_ncstub_login_post last; }
    rewrite ^ /_tpl/login.$ncstub_lang$ncstub_lv.html last;
}
location = /index.php/login {
    include snippets/ncstub_hdr_php.conf;
    rewrite ^ /_tpl/login.$ncstub_lang.html last;
}
location = /_ncstub_login_post {
    internal;
    include snippets/ncstub_hdr_php.conf;
    add_header X-Nextcloud-Bruteforce-Throttled "200ms" always;
    return 303 /login?direct=1;
}
# сброс пароля: как у оригинала -> 200 {"status":"success"}
# (зелёное сообщение «если аккаунт существует, письмо отправлено»)
location = /lostpassword/email {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/json; charset=utf-8";
    if ($request_method != POST) { return 405; }   # GET -> 405, как у эталона
    return 200 "{\"status\":\"success\"}";
}
location = /index.php/lostpassword/email {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/json; charset=utf-8";
    if ($request_method != POST) { return 405; }
    return 200 "{\"status\":\"success\"}";
}

# ---------- служебные эндпойнты (200 — прямая отдача файла через alias) ----------
location = /status.php {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_loose.conf;
    include snippets/ncstub_nostatic.conf;
    add_header Access-Control-Allow-Origin "*" always;
    default_type "application/json";
    alias NCSTUB_ROOT/_svc/status.json;
}
location = /ocs-provider/ { rewrite ^ /_r/ocs_provider last; }
location = /ocm-provider/ { rewrite ^ /_r/ocm last; }
location = /_r/ocs_provider {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_loose.conf;
    include snippets/ncstub_nostatic.conf;
    default_type "application/json";
    alias NCSTUB_ROOT/_svc/ocs_provider.json;
}
location = /_r/ocm {
    internal;
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    include snippets/ncstub_nostatic.conf;
    add_header X-NEXTCLOUD-OCM-PROVIDERS "1" always;
    default_type "application/json";
    alias NCSTUB_ROOT/_svc/ocm_provider.json;
}
location = /index.php/apps/theming/manifest/core {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    include snippets/ncstub_nostatic.conf;
    default_type "application/json; charset=utf-8";
    alias NCSTUB_ROOT/_svc/theming_manifest.json;
}

location = /index.php/204  { include snippets/ncstub_hdr_php.conf; return 204; }
location = /heartbeat           { include snippets/ncstub_hdr_php.conf; return 200 ""; }
location = /index.php/heartbeat { include snippets/ncstub_hdr_php.conf; return 200 ""; }
location = /cron.php {
    include snippets/ncstub_hdr_php.conf; default_type "application/json";
    return 200 "{\"status\":\"success\"}";
}
location = /robots.txt {
    include snippets/ncstub_hdr_common.conf; default_type "text/plain";
    return 200 "User-agent: *\nDisallow: /\n";
}
location = /csrftoken {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/json"; return 200 "{\"token\":\"$request_id$connection:$request_id$msec\"}";
}
location = /index.php/csrftoken {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/json"; return 200 "{\"token\":\"$request_id$connection:$request_id$msec\"}";
}

# capabilities: без заголовка OCS-APIRequest -> 412; с ним -> 200.
# OCS v1 отдаёт в meta statuscode 100, v2 — 200 (как у настоящего NC).
location ~ ^/ocs/v1\.php/cloud/capabilities$ {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/json; charset=utf-8";
    if ($ncstub_ocs = 0)    { return 412 "{\"message\":\"CSRF check failed\"}"; }
    if ($ncstub_fmt = json) { rewrite ^ /_r/caps_v1_json last; }
    rewrite ^ /_r/caps_v1_xml last;
}
location ~ ^/ocs/v2\.php/cloud/capabilities$ {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/json; charset=utf-8";
    if ($ncstub_ocs = 0)    { return 412 "{\"message\":\"CSRF check failed\"}"; }
    if ($ncstub_fmt = json) { rewrite ^ /_r/caps_json last; }
    rewrite ^ /_r/caps_xml last;
}
location ~ ^/ocs/v[12]\.php/cloud/user$ {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/xml; charset=utf-8";
    return 401 "<?xml version=\"1.0\"?>\n<ocs>\n <meta>\n  <status>failure</status>\n  <statuscode>997</statuscode>\n  <message>Current user is not logged in</message>\n </meta>\n <data/>\n</ocs>\n";
}

location ^~ /remote.php/dav    { error_page 401 /_r/dav401; return 401; }
location ^~ /remote.php/webdav { error_page 401 /_r/dav401; return 401; }
location ^~ /public.php        { error_page 401 /_r/dav401; return 401; }

location = /.well-known/caldav  { include snippets/ncstub_hdr_common.conf; return 301 /remote.php/dav/; }
location = /.well-known/carddav { include snippets/ncstub_hdr_common.conf; return 301 /remote.php/dav/; }
location = /.well-known/webfinger {
    include snippets/ncstub_hdr_php.conf; add_header X-NEXTCLOUD-WELL-KNOWN "1" always;
    default_type "application/json; charset=utf-8"; return 404 "{\"message\":\"webfinger not supported\"}";
}
location = /.well-known/nodeinfo {
    include snippets/ncstub_hdr_php.conf; add_header X-NEXTCLOUD-WELL-KNOWN "1" always;
    default_type "application/json; charset=utf-8"; return 404 "{\"message\":\"nodeinfo not supported\"}";
}
location ~ ^/\.well-known/host-meta {
    include snippets/ncstub_hdr_php.conf; add_header X-NEXTCLOUD-WELL-KNOWN "1" always;
    default_type "application/json; charset=utf-8"; return 404 "{\"message\":\"host-meta not supported\"}";
}

# статика приложений (css/js/img/шрифты темы) — публичная, отдаётся файлами.
# Должна идти ДО правила авторизации, иначе оно перехватит /apps/theming/*.
location ^~ /apps/theming/ {
    include snippets/ncstub_hdr_common.conf;
    add_header Cache-Control "public, max-age=15778463, immutable" always;
    try_files $uri @notfound;
}
# маршруты приложений/настроек без авторизации -> 401 JSON (как у эталона)
location ~ ^/(index\.php/)?(apps|settings)/ {
    include snippets/ncstub_hdr_php.conf;
    include snippets/ncstub_csp_api.conf;
    default_type "application/json; charset=utf-8";
    return 401 "{\"message\":\"Current user is not logged in\"}";
}

# экстенлес-иконки темы (нужен явный content-type)
location = /apps/theming/favicon { include snippets/ncstub_hdr_common.conf; default_type "image/x-icon"; add_header Cache-Control "public, max-age=86400" always; }
location = /apps/theming/icon    { include snippets/ncstub_hdr_common.conf; default_type "image/png";    add_header Cache-Control "public, max-age=86400" always; }

# ---------- статика ----------
location / {
    include snippets/ncstub_hdr_common.conf;
    add_header Cache-Control "public, max-age=15778463, immutable" always;
    try_files $uri @notfound;
}
location @notfound { return 404; }
error_page 404 /_r/404;

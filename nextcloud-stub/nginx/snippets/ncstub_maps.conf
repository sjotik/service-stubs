# maps (контекст http). Подключается до server-блоков.
map $http_accept_language $ncstub_lang {
    default    en;
    "~*^ru"    ru;
}
map $http_ocs_apirequest $ncstub_ocs { default 0; "~*true" 1; }
map $arg_format $ncstub_fmt          { default "xml"; "json" "json"; }
# вариант страницы входа: ошибка, если есть ?user= или ?direct=
map "$arg_user$arg_direct" $ncstub_lv { default ""; "~.+" ".error"; }

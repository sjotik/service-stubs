# CSP страниц с Vue (вход, 404): nonce генерируется на каждый запрос.
add_header Content-Security-Policy "default-src 'none';base-uri 'none';manifest-src 'self';script-src 'nonce-$request_id';script-src-elem 'strict-dynamic' 'nonce-$request_id';style-src 'self' 'unsafe-inline';img-src 'self' data: blob: https://*.tile.openstreetmap.org;font-src 'self' data:;connect-src 'self';media-src 'self';frame-src 'self';frame-ancestors 'self';form-action 'self'" always;

# =====================================================================
#  Nextcloud-заглушка (статическая имитация). nginx + статика, без PHP.
#  Поведение снято со снимка эталонного Nextcloud 32.0.14.
#  Плейсхолдеры NCSTUB_DOMAIN / NCSTUB_SSL_* (+ NCSTUB_ROOT/NCSTUB_SESSNAME
#  в сниппетах) подставляет install.sh.
#  Вся логика вынесена в snippets/ncstub_locations.conf.
# =====================================================================
include snippets/ncstub_maps.conf;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name NCSTUB_DOMAIN;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS — сама заглушка
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name NCSTUB_DOMAIN;

    ssl_certificate     NCSTUB_SSL_CERT;
    ssl_certificate_key NCSTUB_SSL_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/ncstub_locations.conf;
}

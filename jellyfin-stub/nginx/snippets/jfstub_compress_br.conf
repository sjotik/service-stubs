# Сжатие как у Kestrel (ResponseCompression): brotli в приоритете, gzip — запасной.
# Сжимается на лету (chunked) любой размер; svg, картинки и шрифты — нет.
# text/html в brotli_types/gzip_types не указывается — он сжимается всегда.
# Вариант для nginx с модулем brotli (libnginx-mod-http-brotli-filter).
brotli on;
brotli_comp_level 4;
brotli_min_length 1;
brotli_types text/plain text/css text/javascript application/javascript application/json text/json application/wasm application/xml text/xml;
gzip on;
gzip_vary on;
gzip_min_length 1;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json text/json application/wasm application/xml text/xml;

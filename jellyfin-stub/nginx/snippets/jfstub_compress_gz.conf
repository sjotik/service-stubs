# Сжатие без модуля brotli: только gzip (Kestrel тоже отдаёт gzip, если клиент
# не принимает br); text/html сжимается всегда. Браузеры при этом получат gzip вместо br — допустимое отличие.
gzip on;
gzip_vary on;
gzip_min_length 1;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json text/json application/wasm application/xml text/xml;

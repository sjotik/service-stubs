# Kestrel отдаёт ответы API потоком (Transfer-Encoding: chunked, без Content-Length).
# Активный sub_filter заставляет nginx делать то же самое; сама замена никогда
# не срабатывает. Заодно снимает Last-Modified и Accept-Ranges (у API их нет).
sub_filter_types *;
sub_filter 'jfstub-never-matches-8c1f' '';

# =====================================================================
#  Тело server-блока jellyfin-заглушки: root и все location.
#  Поведение снято со снимка эталонного Jellyfin 10.10.7 (локальный Docker).
#  Плейсхолдер JFSTUB_ROOT подставляет install.sh.
#  ВАЖНО: Jellyfin (ASP.NET) роутит РЕГИСТРОНЕЗАВИСИМО — API-пути через ~* .
# =====================================================================
server_tokens off;
root JFSTUB_ROOT;
absolute_redirect off;
# max_ranges НЕ отключаем: Kestrel у Jellyfin шлёт Accept-Ranges на статике — nginx тоже должен.

gzip on;
gzip_types text/css text/javascript application/json image/svg+xml;
gzip_min_length 256;

types {
    text/html                 html htm;
    text/javascript           js mjs;
    text/css                  css;
    application/json          json map webmanifest;
    application/wasm          wasm;
    image/svg+xml             svg svgz;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/webp                webp;
    image/gif                 gif;
    image/x-icon              ico;
    font/woff                 woff;
    font/woff2                woff2;
    font/ttf                  ttf;
    font/otf                  otf;
    text/plain                txt;
    application/xml           xml;
}
default_type application/octet-stream;

# пустые тела 401/404 (как эталон: Content-Length 0, с X-Response-Time-ms) — через 0-байт файл
error_page 401 =401 /_jf_empty;
error_page 404 =404 /_jf_empty;
location = /_jf_empty { internal; include snippets/jfstub_hdr_common.conf; alias JFSTUB_ROOT/_svc/empty; }
location @jf_404 { include snippets/jfstub_hdr_common.conf; return 404; }

# служебные тела наружу напрямую не отдаём
location ^~ /_svc/ { internal; }

# ---------- корень -> web/ (302, Location обязателен для работы редиректа) ----------
location = / { return 302 web/; }

# ---------- веб-клиент (статика под /web/) ----------
# /web/ -> index.html; существующий файл -> отдаём как статику (ETag/Last-Modified/Accept-Ranges,
# как Kestrel); несуществующий /web/* -> 404 (как эталон, без SPA-fallback).
location = /web { return 301 /web/; }
location ^~ /web/ {
    include snippets/jfstub_hdr_common.conf;
    index index.html;
    try_files $uri $uri/ @jf_404;
}

# ---------- служебные эндпойнты (регистронезависимо) ----------
location ~* ^/System/Info/Public$ {
    include snippets/jfstub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 200 "{\"LocalAddress\":\"\",\"ServerName\":\"Jellyfin\",\"Version\":\"10.10.7\",\"ProductName\":\"Jellyfin Server\",\"OperatingSystem\":\"\",\"Id\":\"2bdcbb30251fad5177a8a3c13167ff3a\",\"StartupWizardCompleted\":true}";
}
location ~* ^/System/Ping$ {
    include snippets/jfstub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 200 "\"Jellyfin Server\"";
}
location ~* ^/System/Info$ {            # без /Public -> 401 пусто
    include snippets/jfstub_hdr_common.conf;
    return 401;
}
location ~* ^/Users/Public$ {
    include snippets/jfstub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 200 "[]";
}

# публичные boot-эндпоинты веб-клиента (нужны для отрисовки логина)
location ~* ^/Branding/Configuration$ {
    include snippets/jfstub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 200 "{\"SplashscreenEnabled\":false}";
}
location ~* ^/Branding/Css(\.css)?$ {
    include snippets/jfstub_hdr_common.conf;
    default_type "text/css; charset=utf-8";
    return 200 "";
}
location ~* ^/QuickConnect/Enabled$ {
    include snippets/jfstub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 200 "true";
}

# ---------- «напомнить пароль»: штатный ответ эталона, ввод не читается ----------
location ~* ^/Users/ForgotPassword$ {
    include snippets/jfstub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 200 "{\"Action\":\"InNetworkRequired\",\"PinFile\":\"\"}";
}

# ---------- логин (регистронезависимо): матрица как у эталона ----------
# не-json -> 415; json без auth-заголовка -> 400; json + auth -> 401. Данные формы не читаются.
location ~* ^/Users/AuthenticateByName$ {
    if ($jf_is_json = 0)  { rewrite ^ /_jf/415 last; }
    if ($jf_has_auth = 0) { rewrite ^ /_jf/400 last; }
    rewrite ^ /_jf/401 last;
}
location = /_jf/415 {
    internal;
    include snippets/jfstub_hdr_common.conf;
    default_type "application/json; charset=utf-8";
    return 415 "{\"type\":\"https://tools.ietf.org/html/rfc9110#section-15.5.16\",\"title\":\"Unsupported Media Type\",\"status\":415,\"traceId\":\"00-$jf_trace-00\"}";
}
location = /_jf/400 {
    internal;
    include snippets/jfstub_hdr_common.conf;
    default_type "text/plain";
    return 400 "Error processing request.";
}
location = /_jf/401 {
    internal;
    include snippets/jfstub_hdr_common.conf;
    default_type "text/plain";
    return 401 "Error processing request.";
}

# ---------- прочие реальные authed-ресурсы Jellyfin -> 401 (как эталон) ----------
# (на странице логина не вызываются, но для правдоподобия на прямые пробы отвечаем 401).
location ~* ^/(Sessions|Items|Artists|Genres|ScheduledTasks|Plugins|Devices|System/Endpoint|System/Configuration)(/|$) {
    include snippets/jfstub_hdr_common.conf;
    return 401;
}

# ---------- всё прочее -> 404 пусто ----------
location / {
    include snippets/jfstub_hdr_common.conf;
    return 404;
}

# maps (контекст http). Подключается до server-блоков.

# X-Response-Time-ms: Kestrel у Jellyfin шлёт его почти на всех ответах. nginx сам не
# считает — отдаём правдоподобный float (мс), детерминированный по первому символу
# $request_id (16 корзин). Значения в реалистичном диапазоне ~0.3–5.8 мс.
map $request_id $jf_rt {
    default  "1.2345";
    "~^0"  "0.4821"; "~^1" "1.9532"; "~^2" "0.6138"; "~^3" "3.2104";
    "~^4"  "0.8977"; "~^5" "2.1043"; "~^6" "0.3561"; "~^7" "5.7729";
    "~^8"  "1.4820"; "~^9" "0.7215"; "~^a" "2.6271"; "~^b" "0.5069";
    "~^c"  "4.1187"; "~^d" "0.9934"; "~^e" "1.7753"; "~^f" "0.4412";
}

# Наличие MediaBrowser-авторизации у запроса логина:
# есть заголовок Authorization или X-Emby-Authorization -> 1, иначе 0.
map "$http_authorization$http_x_emby_authorization" $jf_has_auth {
    default 1;
    ""      0;
}

# Content-Type запроса логина: application/json -> 1, иначе 0.
# (эталон: не-json -> 415; json без auth -> 400; json+auth -> 401.)
map $content_type $jf_is_json {
    default        0;
    "~*application/json" 1;
}

# traceId для 415-ответа: формат "00-<32hex>-<16hex>-00"; выводим из $request_id.
map $request_id $jf_trace {
    default         "$request_id-0000000000000000";
    "~^(?<h16>.{16})" "$request_id-$h16";
}

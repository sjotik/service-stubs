# /Items/{itemId}/Images/{imageType}/{imageIndex}
location ~* ^/Items/[^/]+/Images/[^/]+/[^/]+/?$ {
    set $jfstub_allow "DELETE, GET, HEAD, POST";
    if ($request_method = GET) { rewrite ^ /_jf/k17 last; }
    if ($request_method = HEAD) { rewrite ^ /_jf/k17 last; }
    if ($request_method = POST) { return 401; }
    if ($request_method = DELETE) { return 401; }
    return 405;
}


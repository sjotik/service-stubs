# =====================================================================
#  Jellyfin-заглушка (статическая имитация). nginx + статика, без бэкенда.
#  Поведение снято со снимка эталонного Jellyfin 10.10.7 (локальный Docker).
#  Плейсхолдеры JFSTUB_DOMAIN / JFSTUB_SSL_* (+ JFSTUB_ROOT в сниппете)
#  подставляет install.sh. Вся логика — в snippets/jfstub_locations.conf.
# =====================================================================
include snippets/jfstub_maps.conf;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name JFSTUB_DOMAIN;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS — сама заглушка
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name JFSTUB_DOMAIN;

    ssl_certificate     JFSTUB_SSL_CERT;
    ssl_certificate_key JFSTUB_SSL_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/jfstub_locations.conf;
}

# Заголовки «динамических» (API/JSON) ответов Immich + тип по умолчанию.
# add_header не наследуется в location со своими add_header — поэтому дублируем X-Powered-By.
# CORS НЕ добавляем: живой Immich v3.2.4 не шлёт Access-Control-* (проверено на эталоне).
# default_type здесь, т.к. hdr_api используется только на /api/* — все они отдают JSON.
add_header X-Powered-By "Express" always;
add_header X-Correlation-ID "$imstub_cid" always;
add_header Vary "Accept-Encoding" always;
default_type "application/json; charset=utf-8";

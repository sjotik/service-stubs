# =====================================================================
#  Тело server-блока immich-заглушки: root и все location.
#  Поведение снято со снимка эталонного Immich v3.2.4 (локальный Docker).
#  Плейсхолдер IMSTUB_ROOT подставляет install.sh.
#  Редиректы относительные — сохраняют схему/хост/порт.
# =====================================================================
server_tokens off;
root IMSTUB_ROOT;
absolute_redirect off;
max_ranges 0;               # Express не отдаёт Accept-Ranges — убираем и у себя

gzip on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
gzip_min_length 256;

# MIME как у Immich (Express): .js -> text/javascript (а не application/javascript).
# Блок types заменяет унаследованный mime.types для этого сайта — перечисляем явно.
types {
    text/html                 html htm;
    text/javascript           js mjs;
    text/css                  css;
    application/json          json map webmanifest;
    application/wasm          wasm;
    image/svg+xml             svg svgz;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/webp                webp;
    image/avif                avif;
    image/gif                 gif;
    image/x-icon              ico;
    font/ttf                  ttf;
    font/woff                 woff;
    font/woff2                woff2;
    font/otf                  otf;
    text/plain                txt;
    application/xml           xml;
}
default_type application/octet-stream;
# charset=utf-8 ставим точечно в нужных локациях (@spa для html, /custom.css для css),
# глобально НЕ включаем: иначе charset прилип бы к text/plain (robots.txt) — у эталона его нет.

# Express игнорирует хвостовой слеш у маршрутов (/api/x/ == /api/x) — нормализуем,
# иначе точные location = /api/... не матчат вариант со слешем (был бы 404 вместо 200/401).
rewrite ^(/api/.+)/$ $1 last;

# служебные тела наружу напрямую не отдаём
location ^~ /_svc/ { internal; }

# ---------- маркер Immich: /.well-known/immich (отдаёт приложение, не статика) ----------
location = /.well-known/immich {
    include snippets/imstub_hdr_common.conf;     # на эталоне здесь нет X-Correlation-ID
    add_header Vary "Accept-Encoding" always;
    default_type "application/json; charset=utf-8";
    return 200 "{\"api\":{\"endpoint\":\"/api\"}}";
}

# ---------- API: публичные служебные эндпойнты (200, тело из файла -> ETag/Content-Length) ----------
location = /api/server/version {
    include snippets/imstub_hdr_api.conf;
    alias IMSTUB_ROOT/_svc/api_server_version.json;
}
location = /api/server/ping {
    include snippets/imstub_hdr_api.conf;
    alias IMSTUB_ROOT/_svc/api_server_ping.json;
}
location = /api/server/config {
    include snippets/imstub_hdr_api.conf;
    alias IMSTUB_ROOT/_svc/api_server_config.json;
}
location = /api/server/features {
    include snippets/imstub_hdr_api.conf;
    alias IMSTUB_ROOT/_svc/api_server_features.json;
}
location = /api/server/version-history {
    include snippets/imstub_hdr_api.conf;
    alias IMSTUB_ROOT/_svc/api_server_version-history.json;
}
location = /api/server/media-types {
    include snippets/imstub_hdr_api.conf;
    alias IMSTUB_ROOT/_svc/api_server_media-types.json;
}
# публичный конфиг страницы входа (грузится SPA при старте)
location = /api/public/config {
    include snippets/imstub_hdr_api.conf;
    alias IMSTUB_ROOT/_svc/api_public_config.json;
}

# ---------- логин: любой POST -> 401 «неверные данные»; прочие методы -> 404 как у эталона ----------
# Данные формы не читаются и не сохраняются — только штатный ответ.
location = /api/auth/login {
    include snippets/imstub_hdr_api.conf;
    if ($request_method = POST) { return 401 "{\"message\":\"Incorrect email or password\"}"; }
    return 404 "{\"message\":\"Cannot $request_method /api/auth/login\"}";
}


# ---------- реальные authed-ресурсы Immich: без токена -> 401 (а не 404) ----------
# Точные публичные пути выше (location =) побеждают этот regex. Несуществующие пути
# (не из списка) проваливаются в catch-all ниже -> 404 «Cannot ...», как у эталона.
location ~ ^/api/(albums|people|tags|memories|partners|sessions|api-keys|shared-links|libraries|jobs|notifications|activities|stacks|duplicates|faces|users|system-config|server/(about|storage|statistics|license|version-check))(/|$) {
    include snippets/imstub_hdr_api.conf;
    return 401 "{\"message\":\"Authentication required\"}";
}

# ---------- bare /api -> 404 JSON ----------
location = /api {
    include snippets/imstub_hdr_api.conf;
    return 404 "{\"message\":\"Cannot $request_method /api\"}";
}

# ---------- любой прочий /api/* -> 404 JSON (вкл. старое дерево /api/server-info/*) ----------
# Обычный префикс (не ^~), чтобы regex выше успел отработать.
location /api/ {
    include snippets/imstub_hdr_api.conf;
    return 404 "{\"message\":\"Cannot $request_method $uri\"}";
}

# ---------- /custom.css: приложение отдаёт пустой CSS ----------
location = /custom.css {
    include snippets/imstub_hdr_common.conf;     # на эталоне здесь нет X-Correlation-ID
    add_header Vary "Accept-Encoding" always;
    default_type "text/css";
    charset_types text/css;
    charset utf-8;
    return 200 "";
}

# ---------- неизменяемая статика сборки ----------
location ^~ /_app/immutable/ {
    include snippets/imstub_hdr_common.conf;
    add_header Cache-Control "public,max-age=31536000,immutable" always;
    add_header Vary "Accept-Encoding" always;
    try_files $uri @spa;        # как эталон: отсутствующий ассет -> SPA-шелл (200), не 404
}

# ---------- прочая статика + SPA-fallback на index.html ----------
location / {
    include snippets/imstub_hdr_common.conf;
    add_header Vary "Accept-Encoding" always;   # Express шлёт Vary на статику; на / (через @spa) его нет
    try_files $uri @spa;
}
location @spa {
    include snippets/imstub_hdr_common.conf;
    add_header Cache-Control "no-store" always;
    charset utf-8;                 # text/html уже в дефолтном charset_types -> charset без warning
    try_files /index.html =404;
}

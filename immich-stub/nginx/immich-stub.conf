# =====================================================================
#  Immich-заглушка (статическая имитация). nginx + статика, без бэкенда.
#  Поведение снято со снимка эталонного Immich v3.2.4 (локальный Docker).
#  Плейсхолдеры IMSTUB_DOMAIN / IMSTUB_SSL_* (+ IMSTUB_ROOT в сниппете)
#  подставляет install.sh. Вся логика — в snippets/imstub_locations.conf.
# =====================================================================
include snippets/imstub_maps.conf;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name IMSTUB_DOMAIN;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS — сама заглушка
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name IMSTUB_DOMAIN;

    ssl_certificate     IMSTUB_SSL_CERT;
    ssl_certificate_key IMSTUB_SSL_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/imstub_locations.conf;
}
